name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 6 hours (at 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          # REPLACE WITH YOUR ACTUAL STREAMLIT APP URL
          APP_URL="https://your-app-name.streamlit.app"
          
          echo "Pinging $APP_URL..."
          response=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL")
          echo "HTTP Response Status: $response"
          
          if [ "$response" -eq 200 ] || [ "$response" -eq 302 ]; then
            echo "App is active and alive!"
          else
            echo "Warning: Received HTTP status $response"
          fi
